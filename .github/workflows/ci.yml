name: ci
on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test

  docker-build:
    if: github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push images
        run: |
          docker build -f docker/Dockerfile.ingest -t ghcr.io/${{ github.repository }}/ingest:latest .
          docker build -f docker/Dockerfile.station -t ghcr.io/${{ github.repository }}/station:latest .
          docker push ghcr.io/${{ github.repository }}/ingest:latest
          docker push ghcr.io/${{ github.repository }}/station:latest